<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة لقمة داخل جسمك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F8;--card:#fff;--ink:#14213D;--mute:#5B6B86;--line:#C9D4E3;--acc:#E8573C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#162038;--ink:#EAF0FA;--mute:#9FB0CC;--line:#2A3858;--acc:#FF7A5F}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#162038;--ink:#EAF0FA;--mute:#9FB0CC;--line:#2A3858;--acc:#FF7A5F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:27px;font-weight:800;margin:0}
.by{display:inline-block;margin:6px 0 14px;padding:3px 14px;border-radius:99px;background:var(--acc);color:#fff;font-size:14px;font-weight:500}
.stage{border-radius:22px;background:radial-gradient(circle at 50% 35%,#24406E,#0A1328 75%);padding:10px 0 6px;text-align:center;overflow:hidden}
.stage svg{height:310px;max-width:100%}
.org{opacity:.25;transition:opacity .5s}
.org.hot{opacity:1;filter:drop-shadow(0 0 7px rgba(255,255,255,.75));animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 13px rgba(255,255,255,.95))}}
#bead{transition:transform .9s cubic-bezier(.5,0,.2,1)}
.chips{display:flex;justify-content:space-between;gap:4px;padding:6px 10px 4px}
.chips button{flex:1;font-size:20px;padding:5px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer}
.chips button.cur{background:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);margin-top:12px}
.hd{display:flex;align-items:center;gap:10px}
.ico{font-size:34px;line-height:1}
h2{font-size:24px;font-weight:800;margin:0}
.facts{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 12px;font-size:14px;color:var(--mute)}
.scene{border-radius:16px;background:linear-gradient(#2B1A33,#14101F);margin:6px 0 10px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
p{margin:0 0 10px}
.meter{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--acc);transition:width .3s}
.res{min-height:46px;font-weight:500}
button.act{width:100%;font:inherit;font-weight:800;font-size:18px;padding:12px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
button.act:active{transform:scale(.98)}
.fun{color:var(--mute);font-size:14px;margin:6px 0 0}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1;font:inherit;font-weight:500;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.nav button:disabled{opacity:.35}
footer{text-align:center;color:var(--mute);font-size:14px;margin-top:18px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.churn{transform-box:fill-box;transform-origin:center;animation:churn 1.8s ease-in-out infinite}
@keyframes churn{50%{transform:scale(1.04,.92)}}
.sway{transform-box:fill-box;transform-origin:center;animation:sway 2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(14deg) translateY(3px)}}
.bub{animation:rise 3s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-85px);opacity:0}}
.fall{animation:fall 3.2s linear infinite}
@keyframes fall{0%{transform:translateY(-30px);opacity:1}100%{transform:translateY(80px);opacity:.3}}
.vil{transform-box:fill-box;transform-origin:bottom;animation:vil 2s ease-in-out infinite}
@keyframes vil{50%{transform:skewX(9deg)}}
.jaw{animation:jaw 1s ease-in-out infinite}
@keyframes jaw{50%{transform:translateY(-16px)}}
.slide{animation:slide 2.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-220px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>رحلة لقمة داخل جسمك</h1>
<div class="by">عمل الطالبة: روند فيصل الدوسري</div>
<div class="stage">
<svg viewBox="0 0 300 385" role="img" aria-label="رسم للجهاز الهضمي">
<rect x="45" y="62" width="210" height="318" rx="85" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
<circle cx="150" cy="30" r="30" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
<g class="org" id="o0"><ellipse cx="150" cy="30" rx="21" ry="10" fill="#FF8FA3"/><rect x="132" y="26" width="36" height="4" rx="2" fill="#fff"/></g>
<g class="org" id="o1"><path d="M150 42V112" stroke="#F4A261" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<g class="org" id="o2"><path d="M142 106C190 98 238 124 228 165C220 198 172 205 150 188C138 178 148 165 164 160C146 148 132 126 142 106Z" fill="#E8573C"/><path d="M175 135C195 140 208 155 203 172" stroke="#FFB4A2" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<g class="org" id="o3"><polyline points="160,232 112,244 190,256 112,268 190,280 112,292 190,304 206,322" stroke="#F4B942" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g>
<g class="org" id="o4"><path d="M94 330V214H206V330" stroke="#B08968" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g>
<g class="org" id="o5"><path d="M206 330Q206 352 150 352V372" stroke="#8D6E63" stroke-width="12" stroke-linecap="round" fill="none"/></g>
<g id="bead"><circle r="10" fill="#fff" stroke="#E8573C" stroke-width="4"/></g>
</svg>
<div class="chips" id="chips"></div>
</div>
<section class="card" id="card" aria-live="polite"></section>
<div class="nav"><button id="next">المحطة التالية</button><button id="prev">السابقة</button></div>
<footer>عمل الطالبة: روند فيصل الدوسري</footer>
</main>
<script>
const S=[
{i:"🦷",n:"الفم",t:"دقائق",ph:"حموضة 7 (متعادلة)",d:"يبدأ الهضم هنا. الأسنان تقطّع الطعام، واللعاب فيه إنزيم الأميليز الذي يبدأ بتكسير النشا.",a:"امضغ",r:"صارت اللقمة عجينة ناعمة جاهزة للبلع.",f:"تفرز غدد اللعاب نحو لتر إلى لترين يومياً.",p:[150,30]},
{i:"〰️",n:"المريء",t:"نحو 10 ثوانٍ",ph:"طوله نحو 25 سم",d:"أنبوب عضلي يدفع الطعام بموجات انقباض متتالية تسمى الحركة الدودية.",a:"ابلع",r:"الموجات دفعت اللقمة نحو المعدة، حتى لو كنت مقلوباً!",f:"لذلك تستطيع الشرب وأنت واقف على رأسك.",p:[150,78]},
{i:"🫃",n:"المعدة",t:"2 إلى 4 ساعات",ph:"حموضة 1.5 إلى 3.5 (قوية)",d:"حمض المعدة وإنزيم البيبسين يهضمان البروتين، وعضلاتها تخلط الطعام كأنها غسالة.",a:"اخلط",r:"تحولت اللقمة إلى سائل كثيف اسمه الكيموس.",f:"بطانة المعدة تتجدد باستمرار حتى لا يهضمها الحمض.",p:[180,150]},
{i:"🌀",n:"الأمعاء الدقيقة",t:"3 إلى 5 ساعات",ph:"طولها نحو 6 أمتار",d:"تصلها الصفراء من الكبد وعصارة البنكرياس فيكتمل هضم الدهون والنشا والبروتين، وهنا يُمتص معظم الغذاء.",a:"امتص",r:"الزغابات الدقيقة نقلت السكر والأحماض الأمينية إلى الدم.",f:"لو فردنا سطحها الداخلي لغطّى مساحة ملعب تنس تقريباً.",p:[150,268]},
{i:"💧",n:"الأمعاء الغليظة",t:"12 ساعة إلى أيام",ph:"طولها نحو 1.5 متر",d:"تمتص الماء والأملاح من الفضلات، وتعيش فيها بكتيريا نافعة تصنع بعض الفيتامينات.",a:"اسحب الماء",r:"صارت الفضلات أكثر تماسكاً وبقي الماء في جسمك.",f:"عدد البكتيريا في أمعائك بالتريليونات.",p:[206,272]},
{i:"🏁",n:"الإخراج",t:"النهاية",ph:"المستقيم ثم فتحة الشرج",d:"تتجمع الفضلات في المستقيم، وعند الامتلاء يرسل الجسم إشارة للتخلص منها.",a:"أنهِ الرحلة",r:"اكتملت الرحلة. يستغرق الهضم كله عادة من يوم إلى 3 أيام.",f:"أنت الآن تعرف كل محطات الرحلة.",p:[150,364]}
];
let cur=0,taps=S.map(()=>0);
const $=id=>document.getElementById(id);
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.i;b.setAttribute('aria-label',s.n);b.onclick=()=>go(i);$('chips').appendChild(b)});
function scene(i,t){
 const W='<svg viewBox="0 0 300 150">';
 if(i==0){const r=34-t*5.5;return W+`<g><rect x="70" y="20" width="160" height="30" rx="14" fill="#FF8FA3"/>${[0,1,2,3,4].map(k=>`<rect x="${82+k*29}" y="46" width="24" height="26" rx="8" fill="#fff"/>`).join('')}</g><circle cx="150" cy="82" r="${r}" fill="#F4B942"/><g class="jaw"><rect x="70" y="100" width="160" height="30" rx="14" fill="#FF8FA3"/>${[0,1,2,3,4].map(k=>`<rect x="${82+k*29}" y="78" width="24" height="26" rx="8" fill="#fff"/>`).join('')}</g></svg>`}
 if(i==1){return W+`<rect x="10" y="52" width="280" height="46" rx="23" fill="none" stroke="#F4A261" stroke-width="7"/><g class="slide"><ellipse cx="270" cy="75" rx="${24-t*2}" ry="14" fill="#F4B942"/></g><path d="M60 20Q75 38 60 50M120 20Q135 38 120 50" stroke="#F4A261" stroke-width="3" fill="none" opacity=".6"/><path d="M60 130Q75 112 60 100M120 130Q135 112 120 100" stroke="#F4A261" stroke-width="3" fill="none" opacity=".6"/></svg>`}
 if(i==2){let b='',c='';for(let k=0;k<12;k++)b+=`<circle class="bub" cx="${55+k*19}" cy="${105+(k%3)*8}" r="${3+k%3}" fill="#fff" style="animation-delay:${k*.27}s"/>`;
  [[110,70],[150,85],[190,68],[130,100],[175,98]].forEach((p,j)=>{c+=j>=t?`<rect class="sway" x="${p[0]}" y="${p[1]}" width="${24-t*2}" height="${18-t}" rx="5" fill="#F4B942"/>`:`<circle cx="${p[0]+8}" cy="${p[1]+6}" r="3" fill="#F4B942" opacity=".7"/><circle cx="${p[0]+16}" cy="${p[1]+9}" r="2" fill="#F4B942" opacity=".7"/>`});
  return W+`<g class="churn"><path d="M25 62C25 12 275 10 275 68C275 130 195 142 120 138C58 134 25 112 25 62Z" fill="#FF9A85" stroke="#C93B22" stroke-width="6"/><path d="M45 62C45 28 255 26 255 70C255 118 190 126 120 122C70 118 45 100 45 62Z" fill="#FFD6CC"/><path d="M45 62C45 28 255 26 255 70C255 118 190 126 120 122C70 118 45 100 45 62Z" fill="#F4B942" opacity="${t*.13}"/>${c}${b}</g></svg>`}
 if(i==3){let v='',n='';for(let k=0;k<10;k++)v+=`<path class="vil" d="M${18+k*28} 150V98q7-14 14 0V150Z" fill="#F7A8B8" style="animation-delay:${k*.2}s"/>`+(k<t*2?`<circle cx="${25+k*28}" cy="126" r="4" fill="#D62839"/>`:'');
  for(let k=0;k<4+t*2;k++)n+=`<circle class="fall" cx="${20+(k*41)%270}" cy="25" r="5" fill="#F4B942" style="animation-delay:${k*.45}s"/>`;return W+n+v+`</svg>`}
 if(i==4){let d='';for(let k=0;k<6;k++)d+=`<text class="fall" x="${30+k*45}" y="20" font-size="22" style="animation-delay:${k*.5}s">💧</text>`;
  return W+`<rect x="20" y="30" width="260" height="70" rx="30" fill="#7A5230"/>${d}<rect x="20" y="${140-t*14}" width="260" height="${t*14}" fill="#4FA3E0" opacity=".85"/></svg>`}
 return W+`<text x="150" y="105" font-size="80" text-anchor="middle">🏁</text></svg>`}
function go(i){cur=Math.max(0,Math.min(5,i));draw()}
function draw(){
 const s=S[cur],t=taps[cur];
 S.forEach((_,k)=>$('o'+k).classList.toggle('hot',k==cur));
 $('bead').style.transform=`translate(${s.p[0]}px,${s.p[1]}px)`;
 [...$('chips').children].forEach((b,k)=>b.className=k==cur?'cur':'');
 $('card').innerHTML=`<div class="hd"><span class="ico">${s.i}</span><h2>${s.n}</h2></div>
 <div class="facts"><span class="chip">المدة: ${s.t}</span><span class="chip">${s.ph}</span></div>
 <div class="scene">${scene(cur,t)}</div>
 <p>${s.d}</p>
 <button class="act" id="act">${s.a}</button>
 <div class="meter"><i style="width:${t*20}%"></i></div>
 <div class="res">${t>=5?s.r:''}</div>
 <p class="fun">معلومة: ${s.f}</p>`;
 $('act').onclick=()=>{if(taps[cur]<5){taps[cur]++;draw()}};
 $('prev').disabled=cur==0;$('next').disabled=cur==5;
}
$('next').onclick=()=>go(cur+1);$('prev').onclick=()=>go(cur-1);
draw();
</script>
</body>
</html>
